{% extends 'base.html' %}

{% block body%}

<div class="container py-5 organizador-dashboard">

    <div class="text-center mb-5">
        <h1 class="display-6 fw-bold text-primary">
            Panel del Organizador
        </h1>
        <p class="text-muted">
            Gestión de Evaluación de Trabajos de Investigación
        </p>
    </div>

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow border-0 dashboard-card">

                <div class="card-body text-center p-5">

                    <div class="mb-4">
                        <i class="bi bi-diagram-3-fill fs-1 text-primary"></i>
                    </div>

                    <h3 class="card-title mb-3">
                        Asignación de Evaluadores
                    </h3>

                    <p class="card-text text-muted mb-4">
                        Ejecuta el proceso de asignación de
                        evaluadores para los trabajos pendientes.
                    </p>

                    <form action="{{ url_for('ejecutarAsignacion') }}"
                          method="POST"
                          onsubmit="return confirm('¿Está seguro que desea ejecutar el proceso de asignación?');">

                        <button type="submit"
                                class="btn btn-primary btn-lg">
                            Ejecutar Asignación
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="{{ url_for('logout') }}"
           class="btn btn-outline-danger">
            Cerrar Sesión
        </a>

    </div>

</div>

{% endblock %}
